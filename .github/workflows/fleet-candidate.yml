name: Fleet candidate bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fleet-candidate.yml
      - scripts/fleet_bundle.py
      - scripts/test-fleet-bundle.py
      - tests/fleet_bundle_contract.rs

permissions:
  contents: read

# A newer push to the same pull request supersedes its candidate build; dispatches never cancel each other.
concurrency:
  group: fleet-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: candidate (x86_64-unknown-linux-gnu)
    runs-on: {group: ent-cygnus, labels: [cygnus]}  # hardened Kata ARC fleet
    container: harbor.unsigned.gg/platform/ci-rust-runner:v0.1.14@sha256:d73d3748c0f22e7386109d12b01ccdf7282b0f529aab2c629b4e5ed558d42bc1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Test bundle verification
        run: python3 scripts/test-fleet-bundle.py
      - name: Build exact-source candidate
        env:
          CANDIDATE_TARGET: x86_64-unknown-linux-gnu
        run: |
          python3 scripts/fleet_bundle.py build \
            --source "$(git rev-parse HEAD)" --target "$CANDIDATE_TARGET" \
            --output target/fleet-bundles > "$RUNNER_TEMP/fleet-candidate.json"
          cat "$RUNNER_TEMP/fleet-candidate.json" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/fleet-candidate.json" target/fleet-bundles/receipt.json
      - name: Upload candidate and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glaeda-candidate-x86_64-unknown-linux-gnu
          path: target/fleet-bundles/
          if-no-files-found: error
          retention-days: 30

  # Scoped off pull_request (SOP: ci-runner-always-internal) so PRs run 100% self-hosted.
  candidate-macos:
    name: candidate (aarch64-apple-darwin)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Test bundle verification
        run: python3 scripts/test-fleet-bundle.py
      - name: Build exact-source candidate
        env:
          CANDIDATE_TARGET: aarch64-apple-darwin
        run: |
          python3 scripts/fleet_bundle.py build \
            --source "$(git rev-parse HEAD)" --target "$CANDIDATE_TARGET" \
            --output target/fleet-bundles > "$RUNNER_TEMP/fleet-candidate.json"
          cat "$RUNNER_TEMP/fleet-candidate.json" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/fleet-candidate.json" target/fleet-bundles/receipt.json
      - name: Upload candidate and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glaeda-candidate-aarch64-apple-darwin
          path: target/fleet-bundles/
          if-no-files-found: error
          retention-days: 30
